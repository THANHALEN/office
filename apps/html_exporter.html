<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick HTML Exporter</title>
  <style>
    /* * CONTEXT FIRST: Utilitarian tool. Terminal/Hacker aesthetic.
     */
    :root {
      --color-bg-primary: #0a0a0a;
      --color-text-primary: #ededed;
      --color-text-muted: #888888;
      --color-accent: #8a2be2;      /* violet */
      --color-success: #2e8b57;     /* green */
      --color-error: #dc143c;       /* red */
      --color-border: #333333;
      --color-bg-hover: #171717;
      --color-bg-state: transparent;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --color-bg-primary: #ffffff;
        --color-text-primary: #121212;
        --color-text-muted: #666666;
        --color-border: #e0e0e0;
        --color-bg-hover: #f5f5f5;
      }
    }

    body {
      background-color: var(--color-bg-primary);
      color: var(--color-text-primary);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 400;
      font-size: 14px;
      line-height: 1.6;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 150px; /* Fixed height avoids layout shifts */
    }

    /* --- IMPRESSIVE BUTTON (Utilitarian Terminal Style) --- */
    
    /* STATE: default */
    .btn-terminal {
      position: relative;
      background: var(--color-bg-state);
      border: 1px solid var(--color-text-muted);
      color: var(--color-text-primary);
      padding: 16px 32px;
      font-family: inherit;
      font-size: 16px;
      cursor: pointer;
      overflow: hidden;
      transition: transform 0.2s, border-color 0.2s, background-color 0.2s, box-shadow 0.2s;
    }

    /* The scanner line effect (Impressive but uses only transform/opacity) */
    .btn-terminal::before {
      content: '';
      position: absolute;
      top: -100%;
      left: 0;
      right: 0;
      height: 200%;
      background: linear-gradient(to bottom, transparent 45%, var(--color-accent) 50%, transparent 55%);
      opacity: 0;
      transform: translateY(-50%);
      transition: opacity 0.3s;
      pointer-events: none;
    }

    /* STATE: hover */
    .btn-terminal:hover {
      background-color: var(--color-bg-hover);
      border-color: var(--color-accent);
      color: var(--color-accent);
    }

    .btn-terminal:hover::before {
      opacity: 0.15;
      animation: scan 2s linear infinite;
    }

    /* STATE: active */
    .btn-terminal:active {
      transform: scale(0.97);
      background-color: var(--color-accent);
      color: var(--color-bg-primary);
    }

    /* STATE: focus */
    .btn-terminal:focus-visible {
      outline: none;
      box-shadow: 0 0 0 2px var(--color-accent);
    }

    /* STATE: disabled */
    .btn-terminal:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    /* --- INPUT AREA --- */
    
    .input-wrapper {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    /* UI Flow Toggles */
    .show-input .input-wrapper { display: flex; }
    .show-input .btn-terminal { display: none; }

    /* Touch-friendly input (taller padding for fat fingers) */
    .paste-input {
      background: var(--color-bg-hover);
      border: 1px dashed var(--color-border);
      color: var(--color-accent);
      padding: 16px 24px;
      width: 280px;
      font-family: inherit;
      font-size: 14px;
      text-align: center;
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
    }

    .paste-input:focus {
      outline: none;
      border-color: var(--color-accent);
      border-style: solid;
      box-shadow: 0 0 0 2px var(--color-accent);
    }

    .status-text {
      font-size: 12px;
      color: var(--color-text-muted);
      min-height: 20px;
    }

    /* STATE MODIFIERS */
    .is-success {
      border-color: var(--color-success) !important;
      color: var(--color-success) !important;
    }
    
    .is-error {
      border-color: var(--color-error) !important;
      color: var(--color-error) !important;
    }

    @media (prefers-reduced-motion: no-preference) {
      @keyframes scan {
        0% { transform: translateY(-50%); }
        100% { transform: translateY(50%); }
      }
    }
  </style>
</head>
<body>

  <main id="appContainer" class="container">
    
    <button id="btnAction" class="btn-terminal" aria-label="Initialize export process">
      [ initialize export ]
    </button>

    <div id="inputArea" class="input-wrapper">
      <input type="text" id="txtPaste" class="paste-input" autocomplete="off">
      <div id="statusText" class="status-text">Awaiting data stream...</div>
    </div>
    
  </main>

  <script>
    /**
     * CODE STRUCTURE
     * High-level = WHAT. Low-level = HOW.
     */

    const ELEMENTS = {
      appContainer: document.getElementById('appContainer'),
      btnAction: document.getElementById('btnAction'),
      txtPaste: document.getElementById('txtPaste'),
      statusText: document.getElementById('statusText')
    };

    const CONSTANTS = {
      DEFAULT_FILE_NAME: 'exported_document',
      MIME_TYPE_HTML: 'text/html',
      RESET_DELAY_MS: 3000
    };

    // --- HIGH LEVEL ABSTRACTION (WHAT) ---

    function initializeApp() {
      ELEMENTS.btnAction.addEventListener('click', prepareForPaste);
      ELEMENTS.txtPaste.addEventListener('paste', handlePastedContent);
      document.addEventListener('click', handleOutsideClick);
    }

    function prepareForPaste(event) {
      event.stopPropagation();
      
      const isTouchDevice = window.matchMedia('(pointer: coarse)').matches;
      
      // Update placeholder based on context (touch vs mouse/keyboard)
      ELEMENTS.txtPaste.placeholder = isTouchDevice 
        ? 'Long press here -> Paste' 
        : 'Press Ctrl + V now';

      ELEMENTS.appContainer.classList.add('show-input');
      ELEMENTS.txtPaste.focus();
      showStatusMessage('Awaiting data stream...', 'default');
    }

    function handlePastedContent(event) {
      event.preventDefault(); 
      
      const pastedContent = (event.clipboardData || window.clipboardData).getData('text');
      
      if (!pastedContent || pastedContent.trim() === '') {
        showStatusMessage('Error: Stream is empty.', 'error');
        scheduleReset();
        return;
      }

      processAndExport(pastedContent);
    }

    function processAndExport(rawContent) {
      try {
        const fileName = extractFilename(rawContent);
        const htmlPayload = formatAsHtml(rawContent);
        
        triggerFileDownload(htmlPayload, fileName);
        showStatusMessage(`Successfully exported: ${fileName}.html`, 'success');
        
      } catch (error) {
        showStatusMessage(`System failure: ${error.message}`, 'error');
      } finally {
        scheduleReset();
      }
    }

    // --- LOW LEVEL IMPLEMENTATION (HOW) ---

    function extractFilename(content) {
      const titleMatch = content.match(/<title>(.*?)<\/title>/i);
      if (titleMatch && titleMatch[1]) {
        return sanitizeFilename(titleMatch[1]);
      }
      
      const cleanText = content.replace(/<[^>]*>?/gm, '').trim();
      if (cleanText.length > 0) {
        return sanitizeFilename(cleanText.substring(0, 15));
      }
      
      return CONSTANTS.DEFAULT_FILE_NAME;
    }

    function formatAsHtml(content) {
      const hasHtmlTags = /<[a-z][\s\S]*>/i.test(content);
      if (hasHtmlTags) return content;

      return `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Exported Snippet</title>
</head>
<body>
  <pre>${escapeHtml(content)}</pre>
</body>
</html>`;
    }

    function triggerFileDownload(content, filename) {
      const blob = new Blob([content], { type: CONSTANTS.MIME_TYPE_HTML });
      const downloadUrl = URL.createObjectURL(blob);
      const anchorElement = document.createElement('a');
      
      anchorElement.href = downloadUrl;
      anchorElement.download = `${filename}.html`;
      document.body.appendChild(anchorElement);
      anchorElement.click();
      
      document.body.removeChild(anchorElement);
      URL.revokeObjectURL(downloadUrl);
    }

    // --- UI HELPERS ---

    function showStatusMessage(message, stateVariant) {
      ELEMENTS.statusText.textContent = message;
      ELEMENTS.txtPaste.classList.remove('is-success', 'is-error');
      ELEMENTS.statusText.classList.remove('is-success', 'is-error');
      
      if (stateVariant !== 'default') {
        ELEMENTS.txtPaste.classList.add(`is-${stateVariant}`);
        ELEMENTS.statusText.classList.add(`is-${stateVariant}`);
      }
    }

    function handleOutsideClick(event) {
      if (ELEMENTS.appContainer.classList.contains('show-input') && 
          !ELEMENTS.txtPaste.contains(event.target)) {
        resetUi();
      }
    }

    function scheduleReset() {
      setTimeout(resetUi, CONSTANTS.RESET_DELAY_MS);
    }

    function resetUi() {
      ELEMENTS.appContainer.classList.remove('show-input');
      ELEMENTS.txtPaste.value = '';
    }

    // --- UTILITIES ---

    function sanitizeFilename(name) {
      return name.replace(/[^a-z0-9]/gi, '_').toLowerCase();
    }

    function escapeHtml(unsafeText) {
      return unsafeText
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // Bootstrap
    initializeApp();

  </script>
</body>
</html>
