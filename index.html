<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Store Hub</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: #f5f5f7;
            color: #1d1d1f;
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .header p {
            font-size: 14px;
            color: #86868b;
            margin-top: 6px;
        }

        /* Nút Cài Đặt App Store về Màn hình chính */
        .pwa-install-btn {
            background-color: #0071e3;
            color: #ffffff;
            font-size: 14px;
            font-weight: 500;
            padding: 10px 20px;
            border-radius: 980px;
            border: none;
            cursor: pointer;
            margin-top: 16px;
            display: none;
            box-shadow: 0 4px 12px rgba(0, 113, 227, 0.25);
        }

        .store-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 800px;
        }

        .app-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 20px;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.03);
            transition: all 0.25s ease;
        }

        .app-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 18px 35px rgba(0, 0, 0, 0.08);
        }

        .app-icon {
            width: 60px;
            height: 60px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-bottom: 14px;
            color: #fff;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.12);
        }

        .app-title { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
        .app-desc { font-size: 12px; color: #86868b; margin-bottom: 16px; line-height: 1.4; flex-grow: 1; }

        .btn-get {
            background-color: #f1f1f6;
            color: #0071e3;
            font-size: 13px;
            font-weight: 600;
            padding: 6px 18px;
            border-radius: 980px;
            text-decoration: none;
            transition: background-color 0.2s;
        }

        .btn-get:hover { background-color: #e5e5ea; }

        .loading-spinner {
            font-size: 14px;
            color: #86868b;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Cloud App Store</h1>
        <p>Live synced with OneDrive</p>
        <button class="pwa-install-btn" id="installPwaBtn">📲 Add App Store to Home Screen</button>
    </div>

    <div id="loading" class="loading-spinner">Scanning OneDrive for apps...</div>
    <div class="store-grid" id="storeGrid"></div>

    <script>
        // Đường dẫn Share API OneDrive của bạn
        const ONEDRIVE_SHARE_URL = "https://1drv.ms/f/c/3eac0f6026f6989d/IgCCJEOPRq5UQJTEZzsg9mhYAehJFT0z5zRABX8xmkL_MjM?e=G4S7Xb";

        async function fetchOneDriveApps() {
            const grid = document.getElementById('storeGrid');
            const loading = document.getElementById('loading');

            try {
                // Mã hóa link share sang định dạng base64 chuẩn Microsoft Graph
                const base64Value = btoa(ONEDRIVE_SHARE_URL).replace(/=/g, '').replace(/\//g, '_').replace(/\+/g, '-');
                const apiUrl = `https://api.graph.microsoft.com/v1.0/shares/u!${base64Value}/driveItem/children`;

                const response = await fetch(apiUrl);
                const data = await response.json();

                loading.style.display = 'none';

                if (!data.value) {
                    loading.innerText = "No apps found on OneDrive.";
                    loading.style.display = 'block';
                    return;
                }

                // Lọc chỉ lấy các file có đuôi .html
                const htmlFiles = data.value.filter(file => file.name.endsWith('.html'));

                for (const file of htmlFiles) {
                    // Tải nội dung từng file HTML để đọc Thẻ Metadata
                    const downloadUrl = file["@microsoft.graph.downloadUrl"];
                    const htmlText = await fetch(downloadUrl).then(res => res.text());

                    // Trích xuất metadata bằng DOMParser
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(htmlText, 'text/html');

                    const title = doc.querySelector('meta[name="app-title"]')?.content || file.name.replace('.html', '');
                    const icon = doc.querySelector('meta[name="app-icon"]')?.content || '📱';
                    const desc = doc.querySelector('meta[name="app-desc"]')?.content || 'OneDrive Web Application';
                    const bg = doc.querySelector('meta[name="app-bg"]')?.content || 'linear-gradient(135deg, #0071e3, #42a5f5)';

                    // Dựng App Card ra màn hình Store
                    const card = document.createElement('div');
                    card.className = 'app-card';
                    card.innerHTML = `
                        <div class="app-icon" style="background: ${bg}">${icon}</div>
                        <div class="app-title">${title}</div>
                        <div class="app-desc">${desc}</div>
                        <a href="${downloadUrl}" target="_blank" class="btn-get">OPEN / ADD</a>
                    `;
                    grid.appendChild(card);
                }
            } catch (err) {
                console.error(err);
                loading.innerText = "Error scanning OneDrive. Please check folder share link.";
            }
        }

        fetchOneDriveApps();

        // Xử lý sự kiện "Add to Home Screen"
        let deferredPrompt;
        const installBtn = document.getElementById('installPwaBtn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'inline-block';
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    installBtn.style.display = 'none';
                }
                deferredPrompt = null;
            }
        });
    </script>
</body>
</html>
