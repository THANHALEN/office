<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Office App Store</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: #f5f5f7;
            color: #1d1d1f;
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .header p {
            font-size: 14px;
            color: #86868b;
            margin-top: 6px;
        }

        .store-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 800px;
        }

        .app-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 20px;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.03);
            transition: all 0.25s ease;
        }

        .app-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 18px 35px rgba(0, 0, 0, 0.08);
        }

        .app-icon {
            width: 60px;
            height: 60px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-bottom: 14px;
            color: #fff;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.12);
        }

        .app-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
            text-transform: capitalize;
        }

        .app-desc {
            font-size: 12px;
            color: #86868b;
            margin-bottom: 16px;
            line-height: 1.4;
            flex-grow: 1;
        }

        .btn-get {
            background-color: #f1f1f6;
            color: #0071e3;
            font-size: 13px;
            font-weight: 600;
            padding: 8px 20px;
            border-radius: 980px;
            text-decoration: none;
            transition: background-color 0.2s;
        }

        .btn-get:hover {
            background-color: #0071e3;
            color: #ffffff;
        }

        .status {
            font-size: 14px;
            color: #86868b;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Office App Store</h1>
        <p>Automatically synced with GitHub Repository</p>
    </div>

    <div id="status" class="status">Scanning /apps folder...</div>
    <div class="store-grid" id="storeGrid"></div>

    <script>
        // Cấu hình Username và Repo GitHub của bạn
        const GITHUB_USER = "THANHALEN";
        const GITHUB_REPO = "office";

        async function autoScanApps() {
            const grid = document.getElementById('storeGrid');
            const status = document.getElementById('status');

            try {
                // Tự động gọi GitHub API quét thư mục /apps
                const apiUrl = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/apps`;
                const response = await fetch(apiUrl);
                
                if (!response.ok) {
                    throw new Error("Folder '/apps' not found or empty.");
                }

                const files = await response.json();
                
                // Lọc lấy các file HTML trong thư mục apps
                const htmlFiles = files.filter(f => f.name.endsWith('.html'));

                status.style.display = 'none';

                if (htmlFiles.length === 0) {
                    status.innerText = "No .html apps found in /apps folder.";
                    status.style.display = 'block';
                    return;
                }

                // Màu gradient ngẫu nhiên cho icon app thêm sinh động
                const gradients = [
                    "linear-gradient(135deg, #0071e3, #42a5f5)",
                    "linear-gradient(135deg, #ff9500, #ffcc00)",
                    "linear-gradient(135deg, #34c759, #30b0c7)",
                    "linear-gradient(135deg, #af52de, #ff2d55)",
                    "linear-gradient(135deg, #5856d6, #32ade6)"
                ];

                htmlFiles.forEach((file, index) => {
                    // Tự động làm sạch tên file để đặt làm tiêu đề (VD: html-creator.html -> Html Creator)
                    const appName = file.name.replace('.html', '').replace(/[-_]/g, ' ');
                    const appUrl = `./apps/${file.name}`;
                    const bg = gradients[index % gradients.length];

                    const card = document.createElement('div');
                    card.className = 'app-card';
                    card.innerHTML = `
                        <div class="app-icon" style="background: ${bg}">⚡</div>
                        <div class="app-title">${appName}</div>
                        <div class="app-desc">Web Utility App</div>
                        <a href="${appUrl}" target="_blank" class="btn-get">OPEN</a>
                    `;
                    grid.appendChild(card);
                });

            } catch (err) {
                console.error(err);
                status.innerText = "Please create an '/apps' folder in your repository and upload .html files there.";
            }
        }

        autoScanApps();
    </script>
</body>
</html>
